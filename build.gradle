plugins {
    id 'groovy'
    id 'maven-publish'
}

group = 'ru.abrosimov'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.codehaus.groovy:groovy-all:3.0.21'
}

sourceSets {
    main {
        groovy {
            srcDirs = ['src']
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            artifactId = 'jenkins-shared-lib'
        }
    }

    repositories {
        mavenLocal()
    }
}
